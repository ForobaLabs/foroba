<!doctype html>
<html lang="en" data-app="kelen">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2F5BEA" />
    <meta name="description" content="Kelen by Foroba — your whole wealth at a glance: net worth, goals and what-if simulation." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kelen" />
    <link rel="apple-touch-icon" href="/icons/kelen-180.png" />
    <title>Kelen by Foroba</title>
    <script>
      (function(){
        var t = localStorage.getItem('foroba.theme') || 'system';
        var d = document.documentElement;
        if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches)) {
          d.classList.add('dark');
        } else {
          d.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
