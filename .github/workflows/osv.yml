name: osv-scanner

# Plan AU H-3: dependency advisories on every push/PR (lockfiles + requirements).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: --config ./osv-scanner.toml --no-resolve --recursive ./
      # Private repos have no code-scanning upload; findings go to the job log.
      upload-sarif: false
      # Gating since pre-beta Task 1.2 (SCA clean); accepted build-time lows live in osv-scanner.toml.
      fail-on-vuln: true
