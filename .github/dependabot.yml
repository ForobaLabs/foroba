# Pre-beta Task 1.2: weekly grouped version updates; security updates are enabled in repo settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Supply-chain cooldown: let fresh releases age a week; security updates bypass it.
    cooldown:
      default-days: 7
    ignore:
      # Sibling package via file:../foroba-ui; bumped by hand with the submodule.
      - dependency-name: "@foroba/ui"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
