stages:
  - lint
  - test
  - build
  - docker

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml

# The security template jobs run in their own scanner images (no node/pnpm/git) and
# must not inherit `default.before_script` below, which is for this project's own jobs.
semgrep-sast:
  before_script: []
secret_detection:
  before_script: []
kics-iac-sast:
  before_script: []

default:
  image: node:22-alpine
  before_script:
    # `@foroba/ui` is a monorepo-local `file:../foroba-ui` dependency — GitLab CI clones
    # only this project, so the sibling checkout must be cloned + built here.
    - apk add --no-cache git
    - corepack enable
    - corepack prepare pnpm@11.6.0 --activate
    - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/bambac961/foroba-ui.git" "$CI_PROJECT_DIR/../foroba-ui"
    - (cd "$CI_PROJECT_DIR/../foroba-ui" && pnpm install --frozen-lockfile --ignore-scripts && pnpm build)
    - pnpm install --frozen-lockfile --ignore-scripts

lint:
  stage: lint
  script:
    - pnpm exec tsc --noEmit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

test:
  stage: test
  script:
    - pnpm test --run
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

build:
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v.*/

docker-build:
  stage: docker
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  before_script:
    # Dockerfile expects `foroba-ui/` as a sibling in the build context (see its header
    # comment) — same reasoning as the `default` before_script above.
    - apk add --no-cache git
    - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/bambac961/foroba-ui.git" "$CI_PROJECT_DIR/../foroba-ui"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -f Dockerfile -t $IMAGE -t $IMAGE_LATEST ../
    - docker push $IMAGE
    - docker push $IMAGE_LATEST
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
