target-version = "py311"
line-length = 100

# Excludes inert macOS/iCloud Desktop-sync duplicate-conflict files (e.g. "foo 2.py"),
# which are not part of the project and cannot even be imported (spaces in filenames).
extend-exclude = ["* 2.py"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["B008"]
